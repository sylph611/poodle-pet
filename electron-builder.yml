appId: com.sylph.bokki
productName: BOKKI
directories:
  output: dist
files:
  - "out/**/*"
  - "characters/**/*"
  - "package.json"
win:
  target:
    - nsis
    - zip
  icon: characters/poodle/icon-256.png
  # 코드 서명 안 함 — winCodeSign 다운로드/추출 스킵 (Windows 심볼릭 링크 권한 이슈 회피)
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: 뽁이
  # artifactName을 하이픈으로 고정 — latest.yml path와 일치 (수동 Release 업로드 시
  # GitHub이 공백을 dot으로 변환해 404 유발하는 문제 회피)
  artifactName: ${productName}-Setup-${version}.${ext}
# electron-updater가 latest.yml을 이 저장소의 Releases에서 조회
publish:
  provider: github
  owner: sylph611
  repo: poodle-pet
