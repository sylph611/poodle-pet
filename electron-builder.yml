appId: com.sylph.bokki
productName: BOKKI
directories:
  output: dist
files:
  - "out/**/*"
  - "characters/**/*"
  - "package.json"
win:
  target:
    - nsis
    - zip
  icon: characters/poodle/icon-256.png
  # 코드 서명 안 함 — winCodeSign 다운로드/추출 스킵 (Windows 심볼릭 링크 권한 이슈 회피)
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: 뽁이
# electron-updater가 latest.yml을 이 저장소의 Releases에서 조회
publish:
  provider: github
  owner: sylph611
  repo: poodle-pet
