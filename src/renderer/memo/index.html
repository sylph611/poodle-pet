<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>메모 · 뽁이</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="wrap">
      <div class="header">
        <span class="emoji">📝</span>
        <span>메모</span>
      </div>
      <textarea id="input" placeholder="여기에 적고 Enter로 저장"></textarea>
      <div class="hint">Enter — 저장 · Shift+Enter — 줄바꿈</div>
      <div class="search-wrap">
        <input id="search" placeholder="검색" />
      </div>
      <ul id="list"></ul>
    </div>

    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <div class="modal">
        <div class="modal-title" id="modal-title">메모 수정</div>
        <textarea id="modal-input" rows="4"></textarea>
        <div class="modal-hint">Ctrl+Enter — 저장 · Esc — 취소</div>
        <div class="modal-actions">
          <button class="modal-btn cancel" id="modal-cancel">취소</button>
          <button class="modal-btn primary" id="modal-ok">저장</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
